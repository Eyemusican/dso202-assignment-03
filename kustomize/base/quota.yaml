apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-tracker-quota
spec:
  hard:
    pods: "6"
    requests.cpu: "750m"
    requests.memory: 768Mi
    limits.cpu: "1500m"
    limits.memory: 1536Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: task-tracker-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 64Mi
