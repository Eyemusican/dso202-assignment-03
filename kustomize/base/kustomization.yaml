apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Compose: every Assignment 1 resource, shared by all environments
resources:
  - database/pvc.yaml
  - database/deployment.yaml
  - database/service.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - quota.yaml

# Generate: replaces configmap.yaml and secret.yaml from Assignment 1.
# Kustomize adds a content hash to each name and rewrites every
# configMapKeyRef and secretKeyRef to match.
configMapGenerator:
  - name: task-tracker-config
    envs:
      - config.env

secretGenerator:
  - name: task-tracker-secret
    envs:
      - secret.env
