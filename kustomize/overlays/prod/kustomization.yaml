apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Compose: the shared base plus the prod namespace
resources:
  - ../../base
  - namespace.yaml

# Transform: put every object into the prod namespace
namespace: dso202-a3-kustomize-prod

# Transform: environment labels, never on selectors
labels:
  - pairs:
      app.kubernetes.io/environment: prod
      app.kubernetes.io/part-of: task-tracker
    includeSelectors: false
    includeTemplates: true

# Purpose built change: two copies of the stateless tiers.
# The database stays at 1, since one Postgres owns one volume.
replicas:
  - name: backend-deployment
    count: 2
  - name: frontend-deployment
    count: 2

# Patches, applied in this order
patches:
  # Strategic merge: Kubernetes shaped changes
  - path: patch-backend-resources.yaml
  - path: patch-quota.yaml

  # JSON 6902 from a file, targeted at one exact Service
  - target:
      version: v1
      kind: Service
      name: frontend-svc
    path: patch-frontend-service.yaml

  # JSON 6902 inline, targeted at every Deployment.
  # "/" in the annotation key is written as "~1" in the path.
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {}
      - op: add
        path: /metadata/annotations/dso202.cst.edu.bt~1owner
        value: tenzin-namgay
