{{- /*
frontend-service.yaml - NodePort in dev (reachable on localhost:30080),
ClusterIP in prod. nodePort is written only when the type is NodePort
AND a port is given, since a ClusterIP Service cannot have one.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "task-tracker.selectorLabels" . | nindent 4 }}
    tier: frontend
  ports:
    - port: 8080
      targetPort: 8080
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
