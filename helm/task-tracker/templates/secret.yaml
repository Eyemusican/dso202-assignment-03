{{- /*
secret.yaml - Assignment 1 task-tracker-secret, built from .Values.secret.
b64enc encodes each value, as the "data" field of a Secret requires.
Base64 is an encoding, not encryption.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.secret.dbUser | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | b64enc | quote }}
  POSTGRES_USER: {{ .Values.secret.dbUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.dbPassword | b64enc | quote }}
