{{- /*
quota.yaml - Assignment 1 Task 6: namespace ResourceQuota and
per container LimitRange, built from .Values.quota and .Values.limitRange.
*/}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-tracker-quota
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requests.cpu | quote }}
    requests.memory: {{ .Values.quota.requests.memory | quote }}
    limits.cpu: {{ .Values.quota.limits.cpu | quote }}
    limits.memory: {{ .Values.quota.limits.memory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: task-tracker-limits
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.max | nindent 8 }}
      min:
        {{- toYaml .Values.limitRange.min | nindent 8 }}
